name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run C tests
        run: make test

  python-package:
    name: Python package (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/python" -m pip install dist/*.whl
      - name: Run installed-package smoke tests
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/package-test/bin/python" -I "$GITHUB_WORKSPACE/src/tests/test_package.py" -v'
